<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header>
      <p class="kicker">solventa</p>
      <h1 class="login__title">Entra a tu cuenta</h1>
    </header>

    @if (formError(); as error) {
      <div class="callout callout--alert" role="alert">{{ error }}</div>
    }

    <div class="field">
      <label for="email">Correo</label>
      <input
        id="email"
        class="input input--mono"
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.input--invalid]="emailError"
        [attr.aria-invalid]="emailError ? true : null"
        [attr.aria-describedby]="emailError ? 'email-error' : null"
      />
      @if (emailError; as msg) {
        <p id="email-error" class="field__error">{{ msg }}</p>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        class="input"
        formControlName="password"
        autocomplete="current-password"
        [type]="showPassword() ? 'text' : 'password'"
        [class.input--invalid]="passwordError"
        [attr.aria-invalid]="passwordError ? true : null"
        [attr.aria-describedby]="passwordError ? 'password-error' : null"
      />
      @if (passwordError; as msg) {
        <p id="password-error" class="field__error">{{ msg }}</p>
      }
    </div>

    <div class="login__links">
      <button
        type="button"
        class="link"
        (click)="togglePassword()"
        [attr.aria-pressed]="showPassword()"
      >
        {{ showPassword() ? 'Ocultar contraseña' : 'Ver contraseña' }}
      </button>
      <a class="link" routerLink="/recuperar">Olvidé mi contraseña</a>
    </div>

    <button type="submit" class="btn btn--primary btn--lg btn--full" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>

    <footer class="login__footer">
      <span>¿Primera vez en Solventa?</span>
      <a class="btn btn--secondary btn--sm" routerLink="/registro">Crear cuenta</a>
    </footer>
  </form>
</main>
