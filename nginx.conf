server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy al BFF para entorno local con Docker (en AWS la webapp va en S3/CloudFront).
    # Variable + resolver: nginx arranca aunque el BFF aún no exista en la red.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $bff http://bff_web:8000;
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
